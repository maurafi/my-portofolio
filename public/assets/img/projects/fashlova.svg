<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="fashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#fashBg)" rx="16"/>
  <!-- Header -->
  <rect x="40" y="35" width="720" height="50" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="65" y="66" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="800">Fashlova</text>
  <text x="160" y="65" fill="#a1a1aa" font-family="sans-serif" font-size="13">Circular Fashion Ecosystem · Preloved Marketplace · Community Hub</text>
  <rect x="640" y="46" width="100" height="28" rx="6" fill="#10b981"/>
  <text x="655" y="65" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Prototype</text>

  <!-- Mobile Screen Simulation -->
  <rect x="90" y="110" width="180" height="300" rx="20" fill="#18181b" stroke="#52525b" stroke-width="3"/>
  <rect x="145" y="118" width="70" height="12" rx="6" fill="#27272a"/>
  <!-- App Banner -->
  <rect x="105" y="140" width="150" height="75" rx="8" fill="url(#greenGrad)"/>
  <text x="115" y="165" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Trade &amp; Care</text>
  <text x="115" y="182" fill="#d1fae5" font-family="sans-serif" font-size="9">Sustainable wardrobe lifestyle</text>
  <!-- Item grid -->
  <rect x="105" y="225" width="70" height="80" rx="6" fill="#27272a"/>
  <text x="112" y="295" fill="#e4e4e7" font-family="sans-serif" font-size="9" font-weight="600">Preloved Denim</text>
  <rect x="185" y="225" width="70" height="80" rx="6" fill="#27272a"/>
  <text x="192" y="295" fill="#e4e4e7" font-family="sans-serif" font-size="9" font-weight="600">Vintage Knit</text>
  <rect x="105" y="315" width="150" height="40" rx="6" fill="#27272a"/>
  <text x="118" y="338" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">🌱 3.2 kg CO2 Saved</text>
  <!-- Bottom Nav -->
  <rect x="105" y="370" width="150" height="25" rx="6" fill="#27272a"/>
  <circle cx="125" cy="382" r="4" fill="#10b981"/>
  <circle cx="155" cy="382" r="4" fill="#71717a"/>
  <circle cx="185" cy="382" r="4" fill="#71717a"/>
  <circle cx="215" cy="382" r="4" fill="#71717a"/>

  <!-- Feature Cards on Right -->
  <rect x="300" y="110" width="460" height="90" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="325" y="142" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">Circular Economy Business Architecture</text>
  <text x="325" y="165" fill="#d4d4d8" font-family="sans-serif" font-size="13">Model bisnis sirkular: Preloved verified resale, upcycling network,</text>
  <text x="325" y="183" fill="#a1a1aa" font-family="sans-serif" font-size="12">dan reward tokens untuk setiap pakaian yang berhasil disirkulasikan.</text>

  <rect x="300" y="215" width="460" height="90" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="325" y="247" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">Project Leadership &amp; User Flow Modeling</text>
  <text x="325" y="270" fill="#d4d4d8" font-family="sans-serif" font-size="13">Memimpin tim 4 orang merumuskan BMC, arsitektur informasi, alur verifikasi,</text>
  <text x="325" y="288" fill="#a1a1aa" font-family="sans-serif" font-size="12">serta pengujian prototipe Figma berorientasi user-centric design.</text>

  <rect x="300" y="320" width="460" height="90" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="325" y="352" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="bold">Business Plan Competition Semifinalist</text>
  <text x="325" y="375" fill="#d4d4d8" font-family="sans-serif" font-size="13">Berhasil meraih posisi Semifinalis dari ~50 tim peserta nasional berkat</text>
  <text x="325" y="393" fill="#a1a1aa" font-family="sans-serif" font-size="12">kelayakan implementasi operasional dan dampak keberlanjutan yang terukur.</text>
</svg>