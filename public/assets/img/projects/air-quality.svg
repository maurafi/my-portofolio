  <text x="255" y="155" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">34.8 µg/m³</text>
  <text x="385" y="155" fill="#22c55e" font-family="sans-serif" font-size="12">↓ 12.4%</text>

  <rect x="500" y="95" width="260" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="520" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">Primary Indicator</text>
  <text x="520" y="155" fill="#f43f5e" font-family="sans-serif" font-size="24" font-weight="bold">PM10 / O3</text>
  <text x="640" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">Multi-Station</text>

  <!-- Main Chart -->
  <rect x="235" y="195" width="525" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="255" y="225" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="700">Temporal AQI &amp; Pollutant Trend Analysis</text>
  <line x1="255" y1="250" x2="735" y2="250" stroke="#334155" stroke-dasharray="4"/>
  <line x1="255" y1="290" x2="735" y2="290" stroke="#334155" stroke-dasharray="4"/>
  <line x1="255" y1="330" x2="735" y2="330" stroke="#334155" stroke-dasharray="4"/>
  <line x1="255" y1="370" x2="735" y2="370" stroke="#475569"/>
  <path d="M255,350 Q310,290 370,320 T490,260 T610,280 T735,240 L735,370 L255,370 Z" fill="url(#chartGrad)"/>
  <path d="M255,350 Q310,290 370,320 T490,260 T610,280 T735,240" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M255,360 Q320,330 380,340 T500,300 T620,320 T735,280" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4"/>
