<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <!-- Top Bar -->
  <rect x="40" y="35" width="720" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="57" r="6" fill="#ef4444"/>
  <circle cx="85" cy="57" r="6" fill="#eab308"/>
  <circle cx="105" cy="57" r="6" fill="#22c55e"/>
  <text x="130" y="62" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">maurafi-aqi.streamlit.app — Air Quality Analytics Dashboard</text>
  
  <!-- Sidebar -->
  <rect x="40" y="95" width="180" height="315" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="700">Filter Metrics</text>
  <rect x="55" y="145" width="150" height="28" rx="6" fill="#334155"/>
  <text x="65" y="164" fill="#38bdf8" font-family="sans-serif" font-size="12">📍 Beijing / Station A</text>
  <rect x="55" y="185" width="150" height="28" rx="6" fill="#0f172a"/>
  <text x="65" y="204" fill="#94a3b8" font-family="sans-serif" font-size="12">📅 2024 Historical</text>
  <rect x="55" y="225" width="150" height="28" rx="6" fill="#0f172a"/>
  <text x="65" y="244" fill="#94a3b8" font-family="sans-serif" font-size="12">📊 Parameter: PM2.5</text>
  <rect x="55" y="270" width="150" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">Current AQI Index</text>
  <text x="65" y="330" fill="#22c55e" font-family="sans-serif" font-size="28" font-weight="bold">42</text>
  <text x="110" y="325" fill="#22c55e" font-family="sans-serif" font-size="12">Good Level</text>

  <!-- Main Content Cards -->
  <rect x="235" y="95" width="250" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
