  <text x="75" y="358" fill="#99f6e4" font-family="sans-serif" font-size="12">Memberikan kepastian legalitas lahan, kepatuhan sertifikasi keberlanjutan, dan transparansi distribusi komprehensif.</text>
  <text x="75" y="388" fill="#5eead4" font-family="sans-serif" font-size="11">Peran: Project Leader · Analisis Kebutuhan Sistem &amp; Model Bisnis Transparansi Komoditas</text>
