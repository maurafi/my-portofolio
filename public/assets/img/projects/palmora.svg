  <text x="245" y="235" fill="#34d399" font-family="sans-serif" font-size="10">Hash: 0x4f...9c</text>

  <!-- Arrow 2 -->
  <path d="M375,182 L405,182" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>

